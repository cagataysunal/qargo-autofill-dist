<!-- One self-contained page: no external scripts, styles, fonts or images. make_release.sh fills in the public

<style>
  :root { --blue: #1565c0; --ink: #111; --soft: #eef4fc; --line: #c9d7ea; --stop: #b3261e; --stopbg: #fdecea; }

  html { font-size: 22px; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink);
         background: #fff; line-height: 1.5; }

  header { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  header svg { width: 84px; height: 84px; flex: none; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0; flex: 1 1 12rem; }
  h2 { font-size: 1.35rem; margin: 2.2rem 0 .6rem; }
  h3 { font-size: 1.1rem; margin: 0 0 .4rem; }
  p { margin: .6rem 0; }
  button { font: inherit; cursor: pointer; }
  .langs { display: flex; gap: .4rem; flex-wrap: wrap; margin: 1rem 0 0; }
  .langs button, .os button { border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 12px;
         padding: .45rem .9rem; }
  .langs button[aria-pressed="true"], .os button[aria-pressed="true"] { border-color: var(--blue); background: var(--blue); color: #fff; }
  .os { display: flex; gap: .8rem; flex-wrap: wrap; }
  .os button { font-size: 1.25rem; font-weight: 600; padding: .9rem 1.6rem; min-width: 11rem; }
  ol.steps { list-style: none; counter-reset: step; padding: 0; margin: 1rem 0; }
  ol.steps > li { counter-increment: step; position: relative; padding: .9rem 0 .9rem 4.2rem; border-top: 2px solid var(--line);
         font-size: 1.25rem; min-height: 4.4rem; }
  ol.steps > li::before { content: counter(step); position: absolute; left: 0; top: .8rem; width: 3rem; height: 3rem;
         border-radius: 50%; background: var(--blue); color: #fff; font-weight: 700; font-size: 1.6rem; display: flex;
         align-items: center; justify-content: center; }
  kbd { font: inherit; font-weight: 600; border: 2px solid #777; border-bottom-width: 4px; border-radius: 8px;
        padding: 0 .45rem; background: #f6f6f6; white-space: nowrap; }
  .copy { display: block; width: 100%; margin: .8rem 0 .5rem; padding: 1.1rem 1rem; font-size: 1.5rem; font-weight: 700;
          color: #fff; background: var(--blue); border: 0; border-radius: 16px; }
  .copy:active { transform: translateY(2px); }
  .copy.done { background: #1b7f3b; }
  .copy.small { font-size: 1.05rem; padding: .6rem 1rem; width: auto; }
  .linelabel { font-size: .8rem; color: #444; margin: .6rem 0 0; }
  code.line { display: block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .72rem; background: var(--soft);
          border: 2px solid var(--line); border-radius: 10px; padding: .6rem .7rem; overflow-wrap: anywhere; user-select: all; }
  .note { font-size: 1rem; background: var(--soft); border-radius: 12px; padding: .6rem .9rem; margin: .7rem 0 0; }
  .stop { font-size: 1.05rem; background: var(--stopbg); border: 3px solid var(--stop); border-radius: 12px; padding: .7rem .9rem;
          margin: .7rem 0 0; }
  .box { border: 2px solid var(--line); border-radius: 12px; padding: .8rem 1rem; margin: .8rem 0; font-size: 1rem; }
  details { margin: 1rem 0; font-size: .95rem; }
  summary { cursor: pointer; font-weight: 600; padding: .4rem 0; }
  .warn { background: var(--stopbg); border: 3px solid var(--stop); border-radius: 12px; padding: .7rem .9rem; }
  [hidden] { display: none !important; }
  @media (max-width: 560px) { html { font-size: 19px; } ol.steps > li { padding-left: 3.6rem; } }
</style>
</head>

</main>

<script>
(function () {
  "use strict";
  var BASE = "https://raw.githubusercontent.com/cagataysunal/qargo-autofill-dist/main";                       // make_release.sh fills in the public address
  var LINES = {
    mac: "curl -fsSL " + BASE + "/install-macos.sh | bash",
    // try/catch: if the download of the installer itself fails, the window says so and waits instead of closing at once
    win: 'powershell -NoProfile -ExecutionPolicy Bypass -Command "try{irm ' + BASE + '/install-windows.ps1|iex}catch{Write-Host $_;Read-Host \'Not installed. Press Enter\'}"',
    mac_rm: "curl -fsSL " + BASE + "/uninstall-macos.sh | bash",
    win_rm: 'powershell -NoProfile -ExecutionPolicy Bypass -Command "try{irm ' + BASE + '/uninstall-windows.ps1|iex}catch{Write-Host $_;Read-Host \'Press Enter to close\'}"'
  };
  var WHERE = { mac: "~/Library/Application Support/QargoAutofill", win: "%LOCALAPPDATA%\\QargoAutofill" };
  var T = JSON.parse(document.getElementById("strings").textContent);
  var lang = "en", os = "";

  function remembered(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function remember(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private window */ } }

  function detectOs() {
    var ua = navigator.userAgent || "", p = navigator.platform || "";
    if (/Android|iPhone|iPad|iPod/i.test(ua) || (/Mac/i.test(p) && navigator.maxTouchPoints > 1)) return "";   // phone or tablet
    if (/Mac/i.test(p) || /Macintosh/i.test(ua)) return "mac";
    if (/Win/i.test(p) || /Windows/i.test(ua)) return "win";
    return "";
  }

  function line(kind) { return kind === "rm" ? LINES[(os || "mac") + "_rm"] : LINES[kind]; }

  function render() {
    var t = T[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (el) {
      var text = t[el.getAttribute("data-t")];
      if (el.classList.contains("copy") && el.classList.contains("done")) text = t.copied;
      el.innerHTML = text;                                 // the table is ours; it holds <b> and <kbd> on purpose
      if (el.classList.contains("note")) el.hidden = !text || el.id === "other" && !!os;
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-lang]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-os]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-os") === os));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-line]"), function (el) {
      el.textContent = line(el.getAttribute("data-line"));
    });
    document.getElementById("mac").hidden = os !== "mac";
    document.getElementById("win").hidden = os !== "win";
    document.getElementById("after").hidden = !os;
    document.getElementById("other").hidden = !!os;
    document.getElementById("where").textContent = WHERE[os] || "";
    document.getElementById("unstamped").hidden = BASE.indexOf("://") > 0;
  }

  function copy(button) {
    var text = line(button.getAttribute("data-copy"));
    function done(ok) {
      if (!ok) { window.alert(T[lang].copy_failed); return; }
      button.classList.add("done");
      button.innerHTML = T[lang].copied;
      setTimeout(function () { button.classList.remove("done"); button.innerHTML = T[lang].copy; }, 6000);
    }
    function oldWay() {                                    // pages opened from a file, old browsers
      var area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(area);
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, oldWay);
    } else {
      oldWay();
    }
  }

  document.addEventListener("click", function (ev) {
    var b = ev.target.closest ? ev.target.closest("button") : null;
    if (!b) return;
    if (b.hasAttribute("data-lang")) { lang = b.getAttribute("data-lang"); remember("qargo-lang", lang); render(); }
    else if (b.hasAttribute("data-os")) { os = b.getAttribute("data-os"); render(); }
    else if (b.hasAttribute("data-copy")) { copy(b); }
  });

  var wanted = (location.hash || "").replace("#", "") || remembered("qargo-lang");
  if (!wanted) {                                           // the language of the reader's own computer, when we have it
    var prefs = navigator.languages || [navigator.language || ""];
    for (var i = 0; i < prefs.length && !wanted; i++) { var two = String(prefs[i]).slice(0, 2).toLowerCase(); if (T[two]) wanted = two; }
  }
  if (wanted && T[wanted]) lang = wanted;                  // else English
  os = detectOs();
  render();
})();
</script>
